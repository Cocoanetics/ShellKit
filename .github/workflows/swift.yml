---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Xcode 27.1 (the `xcode-27` image) carries Swift 6.4.
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Verify Swift version
        run: v="$(swift --version 2>&1)"; echo "$v"; echo "$v" | grep -q "Swift version 6\.4"
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    # iOS: compile against the device SDK (portability check — swift-
    # subprocess is platform-gated out on iOS / tvOS / watchOS / visionOS,
    # which forbid posix_spawn / fork, so this verifies the
    # `#if canImport(Subprocess)` gates in `DefaultProcessLauncher`
    # compile against the iOS SDK) AND run the test suite on a simulator.
    # The exec-dependent tests no-op on iOS via `guard supportsRealExec`,
    # so what executes is the platform-agnostic surface (launcher wiring,
    # ProcessTable, Shell, argument-parser bridge). Unlike SwiftBash —
    # whose heavier suite intermittently hangs the simulator, so it stays
    # compile-only — ShellKit's tests run cleanly on a sim.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Verify Swift version
        run: v="$(swift --version 2>&1)"; echo "$v"; echo "$v" | grep -q "Swift version 6\.4"
      # This Xcode image ships without the iOS SDK preinstalled; fetch it. The
      # download intermittently flakes on the hosted runner, so retry before failing.
      - name: Install the iOS platform
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "::group::xcodebuild -downloadPlatform iOS (attempt $i)"
            if xcodebuild -downloadPlatform iOS; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "attempt $i failed; retrying in 20s…"; sleep 20
          done
          echo "::error::Could not download the iOS platform after 3 attempts"; exit 1
      - name: Build (iOS device — all package targets)
        run: |
          xcodebuild \
            -scheme ShellKit \
            -destination 'generic/platform=iOS' \
            build
      - name: Test (iOS Simulator)
        run: |
          set -eo pipefail
          # Pick the first available iPhone simulator — don't pin a device
          # name a future Xcode might drop (a future Xcode may ship no "iPhone 16",
          # for example).
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name|test("iPhone"))][0].udid // empty')
          [ -n "$UDID" ] || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "Using simulator $UDID"
          xcodebuild test \
            -scheme ShellKit-Package \
            -destination "platform=iOS Simulator,id=$UDID"

  build-linux:
    # Linux: full build + test. ShellKit has no C-library deps
    # (swift-argument-parser + swift-subprocess are pure Swift), so
    # there's nothing to apt-get install — the swiftlang/swift base
    # image's libc-dev is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.4.2-jammy
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: v="$(swift --version 2>&1)"; echo "$v"; echo "$v" | grep -q "Swift version 6\.4"
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel

  build-windows:
    # Windows: full build + test. Again no C-library deps, so no vcpkg
    # provisioning needed (unlike SwiftBash, which pulls in libgit2 /
    # libbz2 / liblzma / libzstd / liblz4 transitively via SwiftPorts).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4.2"
      - name: Verify Swift version
        shell: bash
        run: v="$(swift --version 2>&1)"; echo "$v"; echo "$v" | grep -q "Swift version 6\.4"
      - name: Build (Windows)
        shell: pwsh
        run: swift build --build-tests -v
      - name: Test (Windows)
        shell: pwsh
        run: swift test -v --skip-build --no-parallel

  # Uses skiptools/swift-android-action which wraps the swift.org Android
  # SDK setup AND runs the SwiftPM tests on an x86_64 Android emulator.
  # No `container:` here — the action provisions its own toolchain and
  # the emulator setup needs nested KVM, which only works on the bare
  # ubuntu-* runner image.
  build-android:
    runs-on: ubuntu-latest
    # First cold run = ~25 min (SDK + NDK + emulator boot dominates);
    # cached subsequent runs are ~5 min. 30 min covers both with a
    # comfortable margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build & Test (Android emulator)
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.4.2"
          # The Swift 6.4 Android SDK requires NDK 30; the runner's
          # default ANDROID_NDK_HOME is still 27.x.
          ndk-version: latest
          # The default GitHub Linux runner has ~14 GiB free; the SDK,
          # NDK, and emulator together push past that without cleanup.
          free-disk-space: true
      # The action leaves the 6.4.2 host toolchain on PATH.
      - name: Verify Swift version
        run: v="$(swift --version 2>&1)"; echo "$v"; echo "$v" | grep -q "Swift version 6\.4"
